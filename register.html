<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CODERWANDA | Create Account</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Arial,sans-serif;background:#f1f5f9;color:#172033;min-height:100vh}
    header{background:#10213d;padding:20px 8%}
    header a{color:#fff;text-decoration:none;font-size:23px;font-weight:800}
    main{width:min(92%,480px);margin:42px auto;background:#fff;padding:34px;border-radius:12px;box-shadow:0 8px 30px #0f172a12}
    h1{text-align:center;color:#10213d;margin-bottom:8px}
    .subtitle{text-align:center;color:#64748b;margin-bottom:25px}
    label{display:block;font-weight:700;margin:15px 0 7px}
    input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:7px;font-size:15px}
    input:focus{outline:2px solid #bfdbfe;border-color:#2563eb}
    button{width:100%;margin-top:24px;padding:14px;background:#2563eb;color:#fff;border:0;border-radius:7px;font-weight:700;font-size:16px;cursor:pointer}
    button:disabled{opacity:.65;cursor:wait}
    #message{display:none;margin-top:16px;padding:12px;border-radius:7px;font-size:14px;line-height:1.5}
    #message.error{display:block;background:#fef2f2;color:#b91c1c}
    #message.success{display:block;background:#f0fdf4;color:#166534}
    .back{text-align:center;margin-top:20px}
    .back a{color:#2563eb;text-decoration:none}
    .notice{font-size:12px;color:#64748b;margin-top:18px;line-height:1.5}
  </style>
</head>
<body>
  <header><a href="index.html">CODERWANDA</a></header>
  <main>
    <h1>Create Account</h1>
    <p class="subtitle">Register to access the CODERWANDA platform.</p>

    <form id="registerForm">
      <label for="fullname">Full name</label>
      <input id="fullname" name="fullname" type="text" autocomplete="name"
             minlength="2" maxlength="80" placeholder="Enter your full name" required>

      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email"
             maxlength="120" placeholder="name@example.com" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password"
             minlength="6" maxlength="100" placeholder="At least 6 characters" required>

      <label for="confirmPassword">Confirm password</label>
      <input id="confirmPassword" name="confirmPassword" type="password"
             autocomplete="new-password" minlength="6" maxlength="100"
             placeholder="Enter password again" required>

      <button id="submitButton" type="submit">Create Account</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>

    <p class="back"><a href="index.html">← Back to home</a></p>
    <p class="notice">Training demonstration only: this browser-only version stores sample account data locally. Do not use a real password or sensitive personal information.</p>
  </main>

  <script>
    "use strict";

    const USERS_KEY = "coderwanda_users";
    const SESSION_KEY = "coderwanda_current_user_id";

    const form = document.getElementById("registerForm");
    const message = document.getElementById("message");
    const submitButton = document.getElementById("submitButton");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = type;
    }

    function readUsers() {
      const saved = localStorage.getItem(USERS_KEY);
      if (!saved) return [];
      const users = JSON.parse(saved);
      if (!Array.isArray(users)) throw new Error("Saved account data is not valid.");
      return users;
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      if (!form.reportValidity()) return;

      const fullname = document.getElementById("fullname").value.trim();
      const email = document.getElementById("email").value.trim().toLowerCase();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (fullname.length < 2) {
        showMessage("Please enter your full name (at least 2 characters).", "error");
        return;
      }
      if (password.length < 6) {
        showMessage("Your password must contain at least 6 characters.", "error");
        return;
      }
      if (password !== confirmPassword) {
        showMessage("The passwords do not match. Please try again.", "error");
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = "Creating account…";

      try {
        const users = readUsers();

        if (users.some(user => user.email === email)) {
          showMessage("This email is already registered. Use a different email address.", "error");
          return;
        }

        const newUser = {
          id: (window.crypto && crypto.randomUUID)
            ? crypto.randomUUID()
            : "user-" + Date.now() + "-" + Math.random().toString(16).slice(2),
          fullname,
          email,
          password,
          registeredAt: new Date().toISOString()
        };

        users.push(newUser);

        // Save the account record for the future login feature.
        localStorage.setItem(USERS_KEY, JSON.stringify(users));

        // Save only the user's ID as the current browser-tab session.
        sessionStorage.setItem(SESSION_KEY, newUser.id);

        // Verify that both storage writes succeeded before navigating.
        const savedUsers = readUsers();
        const savedSessionId = sessionStorage.getItem(SESSION_KEY);
        if (!savedUsers.some(user => user.id === newUser.id) || savedSessionId !== newUser.id) {
          throw new Error("The account could not be verified in browser storage.");
        }

        showMessage("Account created successfully. Opening your dashboard…", "success");
        form.reset();

        window.setTimeout(() => {
          window.location.assign("dashboard.html");
        }, 700);

      } catch (error) {
        console.error("Registration error:", error);
        showMessage(
          "Unable to save your account. Check that browser storage is enabled, then try again.",
          "error"
        );
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Create Account";
      }
    });
  </script>
</body>
</html>
